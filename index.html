<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Income App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .custom-toggle:checked + label {
            background-color: #4F46E5;
        }
        .custom-toggle:checked + label:after {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Auth Section -->
    <div id="authSection" class="min-h-screen p-6">
        <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-md p-6">
            <div class="flex justify-between mb-6">
                <button onclick="showLogin()" id="loginBtn" class="text-indigo-600 dark:text-indigo-400 font-semibold">Login</button>
                <button onclick="showRegister()" id="registerBtn" class="text-gray-500 dark:text-gray-400">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">User ID</label>
                    <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                    <input type="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" required>
                </div>
                <button onclick="login(event)" class="w-full bg-indigo-600 text-white rounded-md py-2 hover:bg-indigo-700">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                    <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                    <input type="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Referral ID (Optional)</label>
                    <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600">
                </div>
                <button onclick="register(event)" class="w-full bg-indigo-600 text-white rounded-md py-2 hover:bg-indigo-700">Register</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden min-h-screen bg-gray-50 dark:bg-gray-900">
        <!-- Navbar -->
        <nav class="bg-white dark:bg-gray-800 shadow-sm">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="text-xl font-bold text-indigo-600 dark:text-indigo-400">AI Income</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="darkMode" class="custom-toggle hidden">
                            <label for="darkMode" class="w-12 h-6 bg-gray-300 rounded-full p-1 flex cursor-pointer">
                                <span class="w-4 h-4 bg-white rounded-full transition-transform duration-300"></span>
                            </label>
                        </div>
                        <button onclick="logout()" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600">
                            <i class="bi bi-box-arrow-right text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 py-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm">Total Earnings</h3>
                        <i class="bi bi-wallet text-indigo-600 dark:text-indigo-400"></i>
                    </div>
                    <p class="text-2xl font-semibold mt-2">₹25,000</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm">Direct Referrals</h3>
                        <i class="bi bi-people text-indigo-600 dark:text-indigo-400"></i>
                    </div>
                    <p class="text-2xl font-semibold mt-2">15</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm">Today's Ads</h3>
                        <i class="bi bi-play-circle text-indigo-600 dark:text-indigo-400"></i>
                    </div>
                    <p class="text-2xl font-semibold mt-2">3/10</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm">Active Package</h3>
                        <i class="bi bi-gift text-indigo-600 dark:text-indigo-400"></i>
                    </div>
                    <p class="text-2xl font-semibold mt-2">Package B</p>
                </div>
            </div>

            <!-- Investment Packages -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Package A</h3>
                    <p class="text-3xl font-bold mb-2">₹1,000</p>
                    <p class="text-gray-500 dark:text-gray-400 mb-4">Earn 5% daily</p>
                    <button onclick="activatePackage('A')" class="w-full bg-indigo-600 text-white rounded-md py-2 hover:bg-indigo-700">Activate</button>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Package B</h3>
                    <p class="text-3xl font-bold mb-2">₹5,000</p>
                    <p class="text-gray-500 dark:text-gray-400 mb-4">Earn 7% daily</p>
                    <button onclick="activatePackage('B')" class="w-full bg-indigo-600 text-white rounded-md py-2 hover:bg-indigo-700">Activate</button>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Package C</h3>
                    <p class="text-3xl font-bold mb-2">₹10,000</p>
                    <p class="text-gray-500 dark:text-gray-400 mb-4">Earn 10% daily</p>
                    <button onclick="activatePackage('C')" class="w-full bg-indigo-600 text-white rounded-md py-2 hover:bg-indigo-700">Activate</button>
                </div>
            </div>

            <!-- Referral Section -->
            <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm mb-6">
                <h3 class="text-lg font-semibold mb-4">Your Referral ID</h3>
                <div class="flex items-center space-x-4">
                    <input type="text" value="AI123456" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" readonly>
                    <button onclick="copyReferralId()" class="bg-indigo-600 text-white rounded-md px-4 py-2 hover:bg-indigo-700">Copy</button>
                </div>
            </div>

            <!-- Withdrawal Section -->
            <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                <h3 class="text-lg font-semibold mb-4">Withdraw Funds</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Amount (Min. ₹500)</label>
                        <input type="number" min="500" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600" required>
                    </div>
                    <button onclick="withdraw(event)" class="bg-indigo-600 text-white rounded-md px-4 py-2 hover:bg-indigo-700">Withdraw</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkMode');
        darkModeToggle.addEventListener('change', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Auth functions
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginBtn').classList.add('text-indigo-600', 'dark:text-indigo-400');
            document.getElementById('loginBtn').classList.remove('text-gray-500', 'dark:text-gray-400');
            document.getElementById('registerBtn').classList.add('text-gray-500', 'dark:text-gray-400');
            document.getElementById('registerBtn').classList.remove('text-indigo-600', 'dark:text-indigo-400');
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('registerBtn').classList.add('text-indigo-600', 'dark:text-indigo-400');
            document.getElementById('registerBtn').classList.remove('text-gray-500', 'dark:text-gray-400');
            document.getElementById('loginBtn').classList.add('text-gray-500', 'dark:text-gray-400');
            document.getElementById('loginBtn').classList.remove('text-indigo-600', 'dark:text-indigo-400');
        }

        function login(e) {
            e.preventDefault();
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function register(e) {
            e.preventDefault();
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function logout() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            showLogin();
        }

        // Dashboard functions
        function activatePackage(package) {
            alert(`Package ${package} activated successfully!`);
        }

        function copyReferralId() {
            navigator.clipboard.writeText('AI123456');
            alert('Referral ID copied to clipboard!');
        }

        function withdraw(e) {
            e.preventDefault();
            alert('Withdrawal request submitted successfully!');
        }

        // Show notification
        function showNotification(message) {
            // Implementation for showing notifications
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
